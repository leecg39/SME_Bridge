services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    environment:
      REDIS_URL: redis://redis:6379/0
      PATASOS_BASE_URL: https://paperclip-829m.srv1607352.hstgr.cloud
    ports:
      - "8001:8001"
    depends_on:
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
    command: sh -c "npm install && NEXT_PUBLIC_API_BASE_URL=http://localhost:8001 npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend
